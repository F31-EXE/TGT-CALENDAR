# Выпуск приложения в сторы по кнопке: Actions → «Release app» → Run workflow.
# Сборка и отправка идут в облаке EAS. Нужен секрет EXPO_TOKEN (expo.dev →
# Account settings → Access tokens). Ключи App Store Connect и Google Play
# должны быть сохранены в EAS (eas credentials) — см. README.
name: Release app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Платформа'
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: 'Сразу отправить в App Store / Google Play'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: EAS build
        run: |
          eas build --platform "${{ inputs.platform }}" --profile production --non-interactive --no-wait \
            ${{ inputs.submit && '--auto-submit' || '' }}
